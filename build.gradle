plugins {
  id 'fabric-loom' version '1.6-SNAPSHOT'
  id 'maven-publish'
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
  maven { url = "https://jitpack.io/" }
  maven { url = "https://maven.nucleoid.xyz/" }
  maven { url "https://maven.rizecookey.net/" }
}

dependencies {
  minecraft "com.mojang:minecraft:${project.minecraft_version}"
  mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
  modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

  modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

  /*
  modRuntime("com.github.SuperCoder7979:databreaker:0.2.6") {
    exclude module: "fabric-loader"
  }

   */

  modImplementation include('fr.catcore:server-translations-api:1.4.1')
  modImplementation include('xyz.nucleoid:packet-tweaker:0.1.2')
  modImplementation include('xyz.nucleoid:fantasy:0.2.8')
  modImplementation include('xyz.nucleoid:more-codecs:0.2.0')

  modImplementation 'xyz.nucleoid:leukocyte:0.1.3'

  modImplementation include('eu.pb4:polymer:0.0.3')

  modCompileOnly('xyz.nucleoid:DisguiseLib:1.0.0')
}

processResources {
  inputs.property "version", project.version
  filteringCharset "UTF-8"

  filesMatching("fabric.mod.json") {
    expand "version": project.version
  }
}

loom {
  accessWidenerPath = file("src/main/resources/plasmid.accesswidener")
  customMinecraftManifest = "https://gist.githubusercontent.com/rizecookey/4c6142baaccc3875f9b227fe22f2ace5/raw/c8ed74b19f7a5315813c9d4b199798b692a8f359/1.16_combat-6.json"

  intermediaryUrl = "https://maven.rizecookey.net/net/fabricmc/intermediary/%1\$s/intermediary-%1\$s-v2.jar"
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
  it.options.encoding = "UTF-8"

  // Minecraft 1.18 (1.18-pre2) upwards uses Java 17.
  it.options.release = targetJavaVersion
}

java {
  withSourcesJar()

  sourceCompatibility = JavaVersion.VERSION_21
  targetCompatibility = JavaVersion.VERSION_21
}

jar {
  from "LICENSE"
}